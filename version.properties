# The version series, read by both app/build.gradle and the release workflow so the tag and
# the number inside the APK can never drift apart.
#
#   versionName = <major>.<minor>.<release-commit count - patchZeroAt>
#   versionCode = codeBase + <total commit count>
#
# The versionName patch counts ONLY commits that change release-relevant paths (app code and
# assets) - the same paths that actually trigger a release build. Commits that touch only docs,
# CI or git hooks (the paths-ignore set in .github/workflows/release.yml: **.md, screenshots,
# LICENSE, .gitattributes, .gitignore, .github, .githooks, firmware) do NOT advance the version,
# so every released version is consecutive and carries exactly one changelog entry (no gaps).
# patchZeroAt is the release-commit count at which the patch level is 0; moving to the next series
# means bumping minor and setting patchZeroAt to the release-commit count of the commit that does it.
# versionCode still counts EVERY commit so it never goes backwards and a build always installs over
# the one before it.
major=1
minor=1
patchZeroAt=65
codeBase=59
